[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sape-mcp"
version = "1.0.0"
description = "MCP-сервер для работы с API sape.ru: проекты, ссылки, поиск площадок и покупка"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "sape-mcp contributors" }]
keywords = ["mcp", "sape", "seo", "llm", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
sape-mcp = "sape_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sape_mcp"]
